version: '3.8'

services:
  economic-engine:
    build:
      context: ./economic
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ENGINE_ID=economic-engine-v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  statistical-engine:
    build:
      context: ./statistical
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENGINE_ID=statistical-engine-v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  simulation-engine:
    build:
      context: ./simulation
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - ENGINE_ID=simulation-engine-v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: kincaid-engines
    driver: bridge