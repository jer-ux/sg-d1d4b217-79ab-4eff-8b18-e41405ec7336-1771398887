version: '3.8'

services:
  medical-trend-engine:
    build: .
    container_name: medical-trend-engine
    ports:
      - "8001:8001"
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s